spring.application.name=SkyNode
spring.config.import=optional:file:./.env.admin[.properties]

spring.datasource.url=jdbc:h2:file:./data/skynode;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable explicitly with the local profile only.
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Required admin account; setup stores only a hash in an ignored local environment file.
skynode.admin.email=${SKYNODE_ADMIN_EMAIL}
skynode.admin.password-hash=${SKYNODE_ADMIN_PASSWORD_HASH}
server.servlet.session.timeout=${SKYNODE_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=SKYNODESESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SKYNODE_SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
